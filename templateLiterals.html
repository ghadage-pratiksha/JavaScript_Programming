<!DOCTYPE html>
<html>
<head>
    <title>Template Literals</title>
</head>

<body>

    <h1>Template Literals</h1>

    <script>

        let name = "Pratiksha";
        let age = 21;
        let city = "Pune";

        let message = `My name is ${name}. I am ${age} years old. I live in ${city}.`;

        console.log(message);

    </script>

</body>
</html>
