<html>
<head>
    <script>
        function getInputFieldValue(){
            let inputValue=document.getElementById('name')
            console.log("inputValue");
            document.getElementById('heading').innerText=inputValue
        }

        function setInputFieldVaalue(){
            let value="code step by step"
            document.getElementById('name').value=value
        }
        
        function removeInputFieldVaalue(){
            document.getElementById('name').value=""
        }
    </script>
  
</head>
<body>
    <h1 id="heading"></h1>
    <input type="text" id="name" placeholder="enter name">
    <button onclick="getInputFieldValue()">Get Value</button><br>
    <button onclick="setInputFieldVaalue()">Set Value</button><br>
    <button onclick="removeInputFieldVaalue()">Remove Value</button>
</body>
</html>
