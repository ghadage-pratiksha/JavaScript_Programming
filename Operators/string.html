<html>
    <head>
        <script>

            function operator(){

                let a = "Hello";
                let b = "World";

                console.log(a + b);

                a += " JavaScript";

                console.log(a);

            }

        </script>
    </head>

    <body>

        <h1>String Operator</h1>

        <button onclick="operator()">Click me</button>

    </body>
</html>
