<html>
    <head>
        <script>

            function operator(){

                let a = 10;

                console.log(a);

                a += 5;
                console.log(a);

                a -= 3;
                console.log(a);

                a *= 2;
                console.log(a);

                a /= 4;
                console.log(a);

                a %= 3;
                console.log(a);

                a **= 2;
                console.log(a);

            }

        </script>
    </head>

    <body>

        <h1>Assignment Operator</h1>

        <button onclick="operator()">Click me</button>

    </body>
</html>
