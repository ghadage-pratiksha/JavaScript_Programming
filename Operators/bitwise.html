<html>
    <head>
        <script>

            function operator(){

                let a = 10;
                let b = 5;

                console.log(a & b);
                console.log(a | b);
                console.log(a ^ b);
                console.log(~a);
                console.log(a << 1);
                console.log(a >> 1);
                console.log(a >>> 1);

            }

        </script>
    </head>

    <body>

        <h1>Bitwise Operator</h1>

        <button onclick="operator()">Click me</button>

    </body>
</html>
