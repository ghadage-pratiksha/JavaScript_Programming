<!DOCTYPE html>
<html>
<head>
    <title>Shallow Copy</title>
</head>
<body>

    <h1>Shallow Copy</h1>

    <script>

        let user = {
            name: "Pratiksha",
            age: 21,
            address: {
                city: "Pune"
            }
        };

        let userCopy = { ...user };

        userCopy.name = "Rahul";
        userCopy.address.city = "Mumbai";

        console.log("Original User:", user);
        console.log("Copied User:", userCopy);

    </script>

</body>
</html>
