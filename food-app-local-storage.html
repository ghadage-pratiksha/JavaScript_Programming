<!DOCTYPE html>
<html>
<head>
    <title>Food App - Local Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1, h2 {
            text-align: center;
        }

        .food-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .food {
            width: 200px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
        }

        .food button,
        #clearCart {
            padding: 8px 15px;
            border: none;
            cursor: pointer;
        }

        .cart {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .remove {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

    <h1>🍔 Food App</h1>

    <div class="food-container">

        <div class="food">
            <h2>Pizza</h2>
            <p>₹200</p>
            <button onclick="addToCart('Pizza', 200)">
                Add to Cart
            </button>
        </div>

        <div class="food">
            <h2>Burger</h2>
            <p>₹120</p>
            <button onclick="addToCart('Burger', 120)">
                Add to Cart
            </button>
        </div>

        <div class="food">
            <h2>Sandwich</h2>
            <p>₹100</p>
            <button onclick="addToCart('Sandwich', 100)">
                Add to Cart
            </button>
        </div>

        <div class="food">
            <h2>Pasta</h2>
            <p>₹180</p>
            <button onclick="addToCart('Pasta', 180)">
                Add to Cart
            </button>
        </div>

    </div>


    <div class="cart">

        <h2>🛒 My Cart</h2>

        <div id="cartItems"></div>

        <h3 id="total">Total: ₹0</h3>

        <button id="clearCart" onclick="clearCart()">
            Clear Cart
        </button>

    </div>


    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        displayCart();


        function addToCart(name, price) {

            let existingItem = cart.find(item => item.name === name);

            if (existingItem) {

                existingItem.quantity++;

            } else {

                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });

            }

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function displayCart() {

            let cartItems = document.querySelector("#cartItems");

            cartItems.innerHTML = "";

            let total = 0;


            cart.forEach((item, index) => {

                let itemTotal = item.price * item.quantity;

                total = total + itemTotal;


                cartItems.innerHTML += `
                    <div class="cart-item">

                        <div>
                            <strong>${item.name}</strong>
                            <br>
                            ₹${item.price} × ${item.quantity}
                            = ₹${itemTotal}
                        </div>

                        <button
                            class="remove"
                            onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>
                `;

            });


            document.querySelector("#total").innerHTML =
                "Total: ₹" + total;
        }


        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function clearCart() {

            cart = [];

            localStorage.removeItem("cart");

            displayCart();
        }

    </script>

</body>
</html>
