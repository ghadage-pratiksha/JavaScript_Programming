<html>
    <head>
        <title>Closures in JS</title>
    </head>

    <body>

        <h1>Closures in JS</h1>

        <button onclick="counter.increment()">Increment</button>
        <button onclick="counter.decrement()">Decrement</button>

        <script>

            // Closure Example 1

            function counterApp() {

                let data = 0;

                return {

                    increment: function() {
                        console.log(++data);
                    },

                    decrement: function() {
                        console.log(--data);
                    }

                };
            }

            let counter = counterApp();

            // console.log(counter.increment());
            // console.log(counter.increment());
            // console.log(counter.increment());
            // console.log(counter.increment());


            // Closure Example 2

            function outer() {

                let msg = "This is outer function scope";

                function inner() {

                    console.log(msg);

                }

                return inner;
            }

            let result = outer();

            result();

        </script>

    </body>
</html>
